{% extends 'base.html' %}

{% block title %}学生管理 - 学生成绩管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>学生管理</h3>
    <a href="/students/add" class="btn btn-dark">+ 添加学生</a>
</div>

<form class="row mb-3" method="get" action="/students">
    <div class="col-md-4">
        <input type="text" class="form-control" name="keyword" placeholder="搜索学号或姓名" value="{{ keyword or '' }}">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-outline-dark">搜索</button>
    </div>
</form>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>班级</th>
            <th>电话</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for s in students %}
        <tr>
            <td>{{ s['stu_no'] }}</td>
            <td>{{ s['name'] }}</td>
            <td>{{ s['gender'] }}</td>
            <td>{{ s['class_name'] }}</td>
            <td>{{ s['phone'] }}</td>
            <td>
                <a href="/students/edit/{{ s['id'] }}" class="btn btn-sm btn-outline-primary">编辑</a>
                <a href="/students/delete/{{ s['id'] }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('确定删除吗？')">删除</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="6" class="text-center text-muted">暂无学生数据</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
