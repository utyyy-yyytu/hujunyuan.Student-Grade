{% extends 'base.html' %}

{% block title %}首页 - 学生成绩管理系统{% endblock %}

{% block content %}
<div class="text-center" style="padding: 60px 20px;">
    <h1 style="color: #2c3e50;">学生成绩管理系统</h1>
    <p class="text-muted fs-5">高效管理学生信息、课程信息与成绩数据</p>
</div>

<div class="row mt-4">
    <div class="col-md-3 mb-3">
        <div class="card text-center p-4">
            <h5>学生管理</h5>
            <p class="text-muted">添加、修改、删除、查询学生信息</p>
            <a href="/students" class="btn btn-dark">进入</a>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card text-center p-4">
            <h5>课程管理</h5>
            <p class="text-muted">管理课程信息和授课教师</p>
            <a href="/courses" class="btn btn-dark">进入</a>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card text-center p-4">
            <h5>成绩管理</h5>
            <p class="text-muted">录入、修改、查询学生成绩</p>
            <a href="/scores" class="btn btn-dark">进入</a>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card text-center p-4">
            <h5>数据统计</h5>
            <p class="text-muted">查看排名、图表分析</p>
            <a href="/statistics" class="btn btn-dark">进入</a>
        </div>
    </div>
</div>
{% endblock %}
