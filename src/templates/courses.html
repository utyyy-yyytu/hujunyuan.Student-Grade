{% extends 'base.html' %}

{% block title %}课程管理 - 学生成绩管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>课程管理</h3>
    <a href="/courses/add" class="btn btn-dark">+ 添加课程</a>
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>课程编号</th>
            <th>课程名称</th>
            <th>学分</th>
            <th>授课教师</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        {% for c in courses %}
        <tr>
            <td>{{ c['course_no'] }}</td>
            <td>{{ c['name'] }}</td>
            <td>{{ c['credit'] }}</td>
            <td>{{ c['teacher'] }}</td>
            <td>
                <a href="/courses/edit/{{ c['id'] }}" class="btn btn-sm btn-outline-primary">编辑</a>
                <a href="/courses/delete/{{ c['id'] }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('确定删除吗？')">删除</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5" class="text-center text-muted">暂无课程数据</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
