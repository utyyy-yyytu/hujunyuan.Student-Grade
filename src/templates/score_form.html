{% extends 'base.html' %}

{% block title %}{{ '编辑' if score else '录入' }}成绩 - 学生成绩管理系统{% endblock %}

{% block content %}
<h3 class="mb-4">{{ '编辑成绩' if score else '录入成绩' }}</h3>

<div class="card p-4" style="max-width: 600px;">
    <form method="post" action="{{ '/scores/edit/' ~ score['id'] if score else '/scores/add' }}">
        <div class="mb-3">
            <label class="form-label">学生</label>
            <select class="form-control" name="student_id" required>
                <option value="">-- 请选择学生 --</option>
                {% for s in students %}
                <option value="{{ s['id'] }}" {{ 'selected' if score and score['student_id'] == s['id'] }}>{{ s['student_no'] }} - {{ s['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">课程</label>
            <select class="form-control" name="course_id" required>
                <option value="">-- 请选择课程 --</option>
                {% for c in courses %}
                <option value="{{ c['id'] }}" {{ 'selected' if score and score['course_id'] == c['id'] }}>{{ c['course_no'] }} - {{ c['course_name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">平时成绩</label>
            <input type="number" step="0.01" class="form-control" name="usual_score" value="{{ score['usual_score'] if score else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">期末成绩</label>
            <input type="number" step="0.01" class="form-control" name="exam_score" value="{{ score['exam_score'] if score else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">学期</label>
            <input type="text" class="form-control" name="term" placeholder="例如：2024-2025上学期" value="{{ score['term'] if score and score['term'] else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">备注</label>
            <input type="text" class="form-control" name="remark" value="{{ score['remark'] if score and score['remark'] else '' }}">
        </div>
        <button type="submit" class="btn btn-dark">{{ '保存修改' if score else '录入' }}</button>
        <a href="/scores" class="btn btn-outline-secondary">取消</a>
    </form>
</div>
{% endblock %}
