{% extends 'base.html' %}

{% block title %}{{ '编辑' if score else '录入' }}成绩 - 学生成绩管理系统{% endblock %}

{% block content %}
<div class="page-header">
    <h3>
        <i class="bi bi-{{ 'pencil' if score else 'plus-circle' }} me-2"></i>
        {{ '编辑成绩' if score else '录入成绩' }}
    </h3>
</div>

<div class="card p-4" style="max-width: 650px;">
    <form method="post" action="{{ '/scores/edit/' ~ score['id'] if score else '/scores/add' }}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">学生 <span class="text-danger">*</span></label>
                <select class="form-select" name="student_id" required>
                    <option value="">-- 请选择学生 --</option>
                    {% for s in students %}
                    <option value="{{ s['id'] }}" {{ 'selected' if score and score['student_id'] == s['id'] }}>{{ s['student_no'] }} - {{ s['name'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">课程 <span class="text-danger">*</span></label>
                <select class="form-select" name="course_id" required>
                    <option value="">-- 请选择课程 --</option>
                    {% for c in courses %}
                    <option value="{{ c['id'] }}" {{ 'selected' if score and score['course_id'] == c['id'] }}>{{ c['course_no'] }} - {{ c['course_name'] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">平时成绩 <span class="text-danger">*</span></label>
                <input type="number" step="0.01" class="form-control" name="usual_score" value="{{ score['usual_score'] if score else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">期末成绩 <span class="text-danger">*</span></label>
                <input type="number" step="0.01" class="form-control" name="exam_score" value="{{ score['exam_score'] if score else '' }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">学期</label>
                <input type="text" class="form-control" name="term" placeholder="例如：2024-2025上学期" value="{{ score['term'] if score and score['term'] else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">备注</label>
                <input type="text" class="form-control" name="remark" value="{{ score['remark'] if score and score['remark'] else '' }}">
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-dark">
                <i class="bi bi-check-lg me-1"></i>{{ '保存修改' if score else '录入成绩' }}
            </button>
            <a href="/scores" class="btn btn-outline-secondary ms-2">
                <i class="bi bi-arrow-left me-1"></i>返回列表
            </a>
        </div>
    </form>
</div>
{% endblock %}
